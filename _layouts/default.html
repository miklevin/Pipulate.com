<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/assets/css/simple.css">
<title>{% if page.type == "post" %}{{ post.title }}{% else %}{{ page.title }}{% endif %} | {{ site.title }}</title>
<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
<link rel="stylesheet" href="/assets/css/style.css" />
<link rel="stylesheet" href="/assets/css/syntax.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Goldman">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mouse+Memoirs">
<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.gaid }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', '{{ site.gaid }}');
</script>
</head>
<body>
<header>
<div style="text-align:center;">
<svg width="63vw" viewbox="0 0 100 50">
  <image xlink:href="/pipulate-logo-white.svg" x="0" y="0" width="100%" height="100%" />
</svg>
</div>
{% include mainnav.html %}
</header>
<main>
{{ content }}
</main>
<footer>
{% include footernav.html %}
</footer>
</body>
</html>
